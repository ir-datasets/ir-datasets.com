[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ir-datasets-attest-server"
version = "0.1.0"
description = "The attestation server behind attest.ir-datasets.com: a small WSGI app over SQLite"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    # ir_datasets.v2 isn't released to PyPI yet -- this is the only branch that has it
    # (same as ../webapp).
    "ir_datasets @ git+https://github.com/ir-datasets/ir-datasets.git@v2",
]

[project.scripts]
ir-datasets-attest-server = "ir_datasets_attest_server.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
