<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>{% block title %}ir-datasets.com{% endblock %}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>
<body>
<header>
  <a class="brand" href="{{ url_for('index') }}">ir-datasets<span class="dim">.com</span></a>
  <nav>
    <a href="{{ url_for('index') }}">Home</a>
    <a href="{{ url_for('browse') }}">Browse</a>
    <a href="https://github.com/ir-datasets/ir-datasets" target="_blank" rel="noopener">GitHub</a>
  </nav>
</header>
<main>
{% block content %}{% endblock %}
</main>
<footer>
  <p>Prototype dynamic site, built on <code>ir_datasets.v2</code> &mdash;
  phase 4 of <code>PLAN_V2_SITE.md</code>. Only datasets ported to v2 so far
  appear here (currently: ANTIQUE).</p>
</footer>
</body>
</html>
